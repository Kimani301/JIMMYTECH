name: Build Windows EXE

on:
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    tags: ["v*"]            # or push a tag like v1.0.0 to also publish a Release

permissions:
  contents: write           # needed to attach the .exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate

      - name: Upload .exe files
        uses: actions/upload-artifact@v4
        with:
          name: JIMMYTECH-windows
          path: |
            dist/*.exe

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
