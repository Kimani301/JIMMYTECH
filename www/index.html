const hay=p=>(p.name+" "+(p.type||"")+" "+p.sku+" "+p.cat).toLowerCase();
const matchQ=(p,q)=>{const t=String(q||"").toLowerCase().split(/\s+/).filter(Boolean);return t.every(w=>hay(p).includes(w))};
const hl=(txt,q)=>{const t=String(q||"").toLowerCase().split(/\s+/).filter(Boolean);let o=E(txt);t.forEach(w=>{if(!w)return;const re=new RegExp("("+E(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");o=o.replace(re,"<mark>$1</mark>")});return o};
/* ---- live suggestion dropdown under a text box (works in WebView and desktop) ---- */
function suggest(inp,getItems,onPick,minChars){
 if(!inp)return;inp.removeAttribute("list");inp.setAttribute("autocomplete","off");
 const host=inp.closest("label")||inp,box=document.createElement("div");box.className="sgbox";box.style.display="none";host.insertAdjacentElement("afterend",box);
 let items=[],act=-1;
 const close=()=>{box.style.display="none";box.innerHTML="";items=[];act=-1};
 const pick=i=>{const it=items[i];if(!it)return;close();onPick(it)};
 const render=()=>{const q=inp.value.trim();if(q.length<(minChars==null?1:minChars)){close();return}
  items=getItems(q).slice(0,8);if(!items.length){close();return}
  act=-1;box.innerHTML=items.map((it,i)=>`<button type="button" data-i="${i}"><span>${it.html||hl(it.label,q)}</span><small>${E(it.sub||"")}</small></button>`).join("");box.style.display="block";
  box.querySelectorAll("button").forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>pick(+b.dataset.i)})};
 inp.addEventListener("input",render);inp.addEventListener("focus",render);
 inp.addEventListener("blur",()=>setTimeout(close,180));
 inp.addEventListener("keydown",e=>{if(box.style.display==="none")return;const bs=box.querySelectorAll("button");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();act=(act+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle("act",i==act));bs[act].scrollIntoView({block:"nearest"})}
  else if(e.key==="Enter"&&act>=0){e.preventDefault();pick(act)}
  else if(e.key==="Escape")close()});
 return{close,render};
}

/* ---------- Access control ---------- */
function sha256(m){const r=(n,x)=>(x>>>n)|(x<<(32-n)),K=[],H=[];let p=0;const isP=n=>{for(let i=2;i*i<=n;i++)if(n%i==0)return 0;return 1},f=n=>((n-Math.floor(n))*4294967296)|0;
 for(let c=2;p<64;c++)if(isP(c)){K[p]=f(Math.cbrt(c));if(p<8)H[p]=f(Math.sqrt(c));p++}
 const b=unescape(encodeURIComponent(m)),l=b.length*8,w=new Array((((l+64)>>9)+1)*16).fill(0);
 for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
 w[l>>5]|=0x80<<(24-l%32);w[w.length-1]=l;
 for(let o=0;o<w.length;o+=16){const W=w.slice(o,o+16),h=H.slice();
  for(let i=0;i<64;i++){if(i>=16){const x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(7,x)^r(18,x)^(x>>>3))+W[i-7]+(r(17,y)^r(19,y)^(y>>>10)))|0}
   const[a,b2,c,d,e,f2,g,hh]=h,t1=(hh+(r(6,e)^r(11,e)^r(25,e))+((e&f2)^(~e&g))+K[i]+W[i])|0,t2=((r(2,a)^r(13,a)^r(22,a))+((a&b2)^(a&c)^(b2&c)))|0;
   h[7]=g;h[6]=f2;h[5]=e;h[4]=(d+t1)|0;h[3]=c;h[2]=b2;h[1]=a;h[0]=(t1+t2)|0}
  for(let i=0;i<8;i++)H[i]=(H[i]+h[i])|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
