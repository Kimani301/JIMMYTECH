  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check the app files are uploaded
        run: test -f www/index.html
      - name: Install Capacitor and write its settings
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"com.jimmytech.dashboard","appName":"Jimmy Tech Dashboard","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - name: App icon (skipped safely if it fails)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JimmyTech-Dashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: JimmyTech-Dashboard.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: JimmyTech-Dashboard.apk
